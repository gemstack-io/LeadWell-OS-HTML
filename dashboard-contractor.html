<!-- START TOP BAR AREA -->

<div 
class="flex-1 flex flex-col min-h-screen transition-all duration-300 ease-in-out w-full min-w-0"
:class="expanded ? 'pl-64' : 'pl-16'">

<!-- STICKY HEADER -->
<header class="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between sticky top-0 z-20 shadow-xs">

<!-- Left side: Expand toggle button on header + Search -->
<div class="flex items-center space-x-4 flex-1 max-w-md">
<!-- Toggle button on top header bar -->
<button 
@click="expanded = !expanded" 
class="p-2 rounded-lg text-blue-500 hover:bg-blue-100 hover:text-blue-800 transition-colors">
<i data-lucide="menu" class="w-5 h-5"></i>
</button>

<div class="relative w-full">
<i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
<input type="text" placeholder="Search leads, projects, or team members..." class="w-full pl-9 pr-4 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
</div>
</div>

<!-- Right Header Actions Container -->
<div class="flex items-center space-x-3" 
     x-data="{
              // Temporary Prototype Navigation Group (Removed in final React build)
        prototypeIcons: [
                { id: 'project-control', label: 'Project Control', icon: 'sliders-horizontal', href: 'project-control.html' },
        { id: 'project-checklist', label: 'Project Checklist', icon: 'list-checks', href: 'project-checklist.html' },
        { id: 'project-review', label: 'Project Review', icon: 'circle-dashed-check', href: 'project-review.html' },
                { id: 'login-page', label: 'User Login View', icon: 'key-round', href: 'login.html' },
        { id: 'team-single', label: 'Single Team Member View', icon: 'user', href: 'team-member.html' },
        { id: 'lead-single', label: 'Single Lead View', icon: 'megaphone', href: 'single-lead.html' },
          { id: 'client-single', label: 'Single Client View', icon: 'file-user', href: 'single-client.html' },
           { id: 'project-single', label: 'Single Project View', icon: 'folder-git-2', href: 'single-project.html' },
            { id: 'niche-targeting', label: 'Niche and Targeting', icon: 'target', href: 'niche.html'},
             { id: 'proposals', label: 'Proposals', icon: 'hand-helping', href: 'proposals.html'},
            { id: 'invoices', label: 'Invoices and Billing', icon: 'receipt-text', href: 'invoices.html' }

        ],

       // Permanent Header Actions Group (Kept in final build)
        permanentIcons: [
         { id: 'money-payroll', label: 'Notifications', icon: 'circle-dollar-sign', href: 'payroll.html' },
          { id: 'bell-notifications', label: 'Notifications', icon: 'bell', href: '#', count: 3 },
          { id: 'envelope-messages', label: 'Messages', icon: 'mail', href: 'message.html', count: 5 }
        ]
     }">

  <!-- GROUP 1: Prototype Nav Icons (Temporary) -->
  <div class="flex items-center space-x-1 pr-2 border-r border-slate-200">
    <template x-for="item in prototypeIcons" :key="item.id">
      <a :href="item.href" 
         :title="item.label" 
         class="p-2 rounded-xl text-slate-500 hover:text-indigo-600 hover:bg-slate-100 transition-colors relative group">
        <i :data-lucide="item.icon" class="w-5 h-5"></i>
      </a>
    </template>
  </div>

  <!-- GROUP 2: Permanent Header Icons (Bell Notifications & Message Envelope with Floating Badges) -->
  <div class="flex items-center space-x-1 pr-1">
    <template x-for="item in permanentIcons" :key="item.id">
      <a :href="item.href" 
         :title="item.label" 
         class="p-2 rounded-xl text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition-colors relative">
        <i :data-lucide="item.icon" class="w-5 h-5"></i>
        
        <!-- Floating Counter Badge -->
        <span x-show="item.count > 0" 
              class="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 bg-rose-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-white leading-none shadow-2xs"
              x-text="item.count">
        </span>
      </a>
    </template>
  </div>

  <!-- New Lead Action Button -->
  <a href="new-lead.html">
    <button class="px-3.5 py-2 text-sm font-semibold bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-2xs flex items-center space-x-2 transition-colors">
      <i data-lucide="plus" class="w-4 h-4"></i>
      <span>New Lead</span>
    </button>
  </a>
