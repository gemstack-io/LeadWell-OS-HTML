<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<!-- Alpine.js (Must be in <head>) -->
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<style type="text/tailwindcss">
</style>
</head>
<script>
document.addEventListener('alpine:initialized', () => {
lucide.createIcons();
});

// Re-render icons on Alpine changes
document.addEventListener('alpine:updated', () => {
lucide.createIcons();
});
</script>  
<body class="overflow-x-hidden bg-slate-50 text-slate-800 antialiased min-h-screen flex" x-data="{ expanded: false }">




<div 
  class="min-h-screen w-full bg-cover bg-center bg-no-repeat flex items-center justify-center p-4 sm:p-6 lg:p-8 font-sans"
  style="background-image: url('bg.jpg');"
> 

 <!-- LIGHT GLASSMORPHISM CARD CONTAINER -->
<!-- MAIN LOGIN CARD (Increased Glass Transparency & Blue Input Icons) -->
<div 
  x-data="{ 
    identity: '', 
    password: '', 
    showPassword: false, 
    rememberMe: false,
    isLoading: false,
    submitForm() {
      this.isLoading = true;
      setTimeout(() => { this.isLoading = false; }, 1500);
    }
  }" 
  class="relative w-full max-w-lg bg-white/10 backdrop-blur-xl border border-white/80 rounded-3xl shadow-2xl pb-8 px-8 pt-3 sm:pb-12 sm:px-12 sm:pt-5 text-slate-800 z-10 ring-1 ring-slate-900/5"
>
  
  <!-- TOP CENTER LOGO & HEADER -->
  <div class="flex flex-col items-center text-center mb-10">
    <!-- Larger App Logo Container -->
    <div class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-sky-300 to-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/30 mb-5 ring-4 ring-white/60">

    </div>
    <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">LeadWell Pro</h1>

    </div>
  <!-- END TOP LOGO HEADER -->

  <!-- LOGIN FORM -->
  <form @submit.prevent="submitForm()" class="space-y-6">
    
<!-- 1. USERNAME OR EMAIL FIELD -->
<div class="form-control w-full space-y-2">
  <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">
    Username or Email
  </label>
  <div class="relative group">
    <!-- Icon Wrapper: Forced to Indigo on Focus -->
    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-blue-600 group-focus-within:!text-indigo-600 transition-colors z-10">
      <i data-lucide="user" class="w-5 h-5"></i>
    </div>
    <!-- Cleaned Input without DaisyUI base class interference -->
    <input 
      type="text" 
      x-model="identity"
      placeholder="name@company.com or username" 
      required
      class="w-full h-14 pl-12 pr-4 bg-white/60 backdrop-blur-sm border border-slate-200/80 text-slate-900 placeholder-slate-400 text-base rounded-xl focus:bg-white focus:outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-500/20 transition-all font-medium shadow-sm" 
    />
  </div>
</div>

<!-- 2. PASSWORD FIELD -->
<div class="form-control w-full space-y-2">
  <div class="flex items-center justify-between">
    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">
      Password
    </label>
    <a href="#" class="text-xs text-blue-600 hover:text-indigo-600 font-semibold transition-colors hover:underline">
      Forgot password?
    </a>
  </div>
  <div class="relative group">
    <!-- Lock Icon Wrapper: Forced to Indigo on Focus -->
    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-blue-600 group-focus-within:!text-indigo-600 transition-colors z-10">
      <i data-lucide="lock" class="w-5 h-5"></i>
    </div>
    <input 
      :type="showPassword ? 'text' : 'password'" 
      x-model="password"
      placeholder="••••••••" 
      required
      class="w-full h-14 pl-12 pr-12 bg-white/60 backdrop-blur-sm border border-slate-200/80 text-slate-900 placeholder-slate-400 text-base rounded-xl focus:bg-white focus:outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-500/20 transition-all font-medium shadow-sm" 
    />
    <!-- Visibility Toggle Eye Icon: Forced to Indigo on Focus -->
    <button 
      type="button" 
      @click="showPassword = !showPassword" 
      class="absolute inset-y-0 right-0 pr-4 flex items-center text-blue-600 group-focus-within:!text-indigo-600 hover:!text-indigo-800 transition-colors z-10"
      tabindex="-1"
    >
      <i :data-lucide="showPassword ? 'eye-off' : 'eye'" class="w-5 h-5"></i>
    </button>
  </div>
</div>

    <!-- REMEMBER ME CHECKBOX -->
    <div class="flex items-center justify-between pt-1">
      <label class="flex items-center space-x-3 cursor-pointer select-none">
        <input 
          type="checkbox" 
          x-model="rememberMe"
          class="checkbox checkbox-primary checkbox-sm rounded-md border-slate-300" 
        />
        <span class="text-sm font-medium text-slate-700">Remember this device</span>
      </label>
    </div>

    <!-- JUICY MEDIUM-LARGE ACTION BUTTON -->
    <button 
      type="submit" 
      :disabled="isLoading"
      class="w-full h-14 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-base shadow-lg shadow-blue-500/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-4"
    >
      <template x-if="!isLoading">
        <span class="flex items-center justify-center gap-2">
          <span>Sign In</span>
          <i data-lucide="arrow-right" class="w-5 h-5"></i>
        </span>
      </template>
      <template x-if="isLoading">
        <span class="loading loading-spinner loading-md"></span>
      </template>
    </button>

  </form>
  <!-- END LOGIN FORM -->

  <!-- CARD FOOTER -->
  <div class="mt-5 pt-6 border-t border-slate-900/10 text-center">
    <p class="text-xs font-medium text-slate-600">
      Don't have an account? 
      <a href="#" class="text-blue-600 hover:text-blue-700 font-bold hover:underline ml-1">Contact Administrator</a>
    </p>
  </div>

</div>
<!-- END MAIN LOGIN CARD CONTAINER -->

</div>



</body>
</html>
